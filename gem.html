    // Flutter への切り替えで色がちらつかないよう、SettingServiceImpl.themeMode の既定値 dark と

    {
      let dark = true;
      let stored = null;
      // サイトデータの保存を禁止した環境では localStorage に触れるだけで例外になるので、そのときは既定値を使う。
      try {
        stored = localStorage.getItem('flutter.theme_mode');
      } catch (e) {}
      const mode = stored === null ? 'dark' : JSON.parse(stored);
      if (mode === 'light') dark = false;
      else if (mode === 'system') dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (new URLSearchParams(location.search).get('isNightMode') === 'true') dark = true;
      document.documentElement.style.backgroundColor = dark ? '#212225' : '#FFFFFF';
    }

  <script>
    // 後から読み込む flutter_bootstrap.js の宣言と名前がぶつからないよう、ブロックの中に閉じ込める。
    {
      // アプリ内の DPCircularProgressIndicator（packages/core/lib/widgets/dp_circular_progress_indicator.dart の
      // _frameCount / _frameDuration）と見た目や速度を揃えるため、同じ8枚を100ms間隔で使う。
      const frames = [];
      for (let n = 1; n <= 8; n++) {
        const img = new Image();
        img.src = `assets/packages/dotpict_core/assets/images/circular_progress_indicator${n}.png`;
        frames.push(img);
      }
      const canvas = document.getElementById('dp-splash-spinner');
      canvas.width = canvas.height = Math.round(32 * window.devicePixelRatio);
      const ctx = canvas.getContext('2d');
      let frame = 0;
      const timer = setInterval(() => {
        const img = frames[frame];
        frame = (frame + 1) % frames.length;
        if (img.complete && img.naturalWidth > 0) {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          // FilterQuality.none と Image.asset(color: lightGray)（dp_colors.dart）の srcIn に合わせ、ドットの輪郭と色を保つ。
          ctx.imageSmoothingEnabled = false;
          ctx.globalCompositeOperation = 'source-over';
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          ctx.globalCompositeOperation = 'source-in';
          ctx.fillStyle = '#ABB4C6';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
      }, 100);
      // Flutter Web エンジンが初回描画後に window へ送るイベントを待ち、表示の空白を防ぐ。
      // イベントは描画が画面に出る前に届くことがある（skwasm は描画を非同期に仕上げる）ので、2フレーム待ってから消す。
      // Flutter の画面は起動画面より上に重なるので、描かれた後まで起動画面が残っていても見た目には出ない。
      window.addEventListener('flutter-first-frame', () => {
        requestAnimationFrame(() => requestAnimationFrame(() => {
          clearInterval(timer);
          document.getElementById('dp-splash').remove();
        }));
      }, { once: true });
    }
  </script>
